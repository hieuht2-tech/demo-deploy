<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết công thức | Food Menu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg" aria-label="Điều hướng chính">
  <div class="container">
    <a class="navbar-brand" href="index.html">
<i class="fa-solid fa-utensils" aria-hidden="true">
</i> Food Menu</a>
    <div class="navbar-nav ms-auto flex-row flex-wrap gap-1">
      <a class="nav-link" href="index.html">Trang chủ</a>
      <a class="nav-link" href="monan.html">Món ăn</a>
      <a class="nav-link" href="douong.html">Đồ uống</a>
      <a class="nav-link" href="dochay.html">Món chay</a>
      <a class="nav-link" href="lienhe.html">Liên hệ</a>
      <a class="nav-link" href="giohang.html">Giỏ hàng <span class="cart-count" data-cart-count>0</span>
</a>
    </div>
  </div>
</nav>
<main class="container my-5">
<nav class="recipe-breadcrumb" aria-label="Đường dẫn">
<a id="recipe-back" href="monan.html">Món ăn</a>
<span aria-hidden="true">/</span>
<span id="recipe-breadcrumb">Chi tiết công thức</span>
</nav>
<div id="recipe-detail" aria-busy="true">Đang tải công thức...</div>
<template id="recipe-detail-template">
<article class="recipe-layout">
<div>
<img class="recipe-image" alt="">
<p class="small text-muted mt-3">Công thức tham khảo từ TheMealDB / TheCocktailDB. Không có giá bán hoặc tồn kho.</p>
</div>
<div>
<span class="recipe-kicker">KHÁM PHÁ CÔNG THỨC</span>
<h1 class="recipe-title">
</h1>
<p class="recipe-meta text-muted">
</p>
<p id="recipe-rating" class="recipe-rating">
</p>
<h2 class="h5 mt-4">Nguyên liệu</h2>
<ul class="recipe-ingredients">
</ul>
<div class="d-flex flex-wrap gap-3 mt-4">
<a class="recipe-source btn btn-outline-orange" target="_blank" rel="noopener">Nguồn công thức</a>
<a class="recipe-video btn btn-outline-orange" target="_blank" rel="noopener">Xem video hướng dẫn</a>
</div>
</div>
</article>
<section class="recipe-section">
<h2 class="h4">Cách thực hiện</h2>
<p class="recipe-directions">
</p>
</section>
<section class="recipe-section">
<div class="row g-4">
<div class="col-lg-5">
<div class="review-form-box">
<h2 class="h5">Đánh giá của bạn</h2>
<p class="small text-muted">Đánh giá được lưu trên trình duyệt này, chưa phải bình luận công khai từ server.</p>
<form id="recipe-review-form">
<label class="form-label" for="review-stars">Số sao</label>
<select id="review-stars" name="stars" class="form-select mb-3">
<option value="5">5 sao - Rất thích</option>
<option value="4">4 sao - Thích</option>
<option value="3">3 sao - Bình thường</option>
<option value="2">2 sao - Chưa thích</option>
<option value="1">1 sao - Không thích</option>
</select>
<label class="form-label" for="review-comment">Nhận xét</label>
<textarea id="review-comment" name="comment" class="form-control mb-3" rows="4" maxlength="500" required>
</textarea>
<button class="btn btn-orange" type="submit">Lưu đánh giá</button>
<p id="review-feedback" role="status" aria-live="polite">
</p>
</form>
</div>
</div>
<div class="col-lg-7">
<h2 class="h5">Các đánh giá đã lưu</h2>
<div id="recipe-reviews">
</div>
</div>
</div>
</section>
</template>
</main>
<footer>
<h4>Food Menu</h4>
<p class="mb-0">Khám phá công thức và chia sẻ trải nghiệm ẩm thực.</p>
</footer>
<script src="assets/js/app.js" defer>
</script>
<script src="assets/js/config.js" defer>
</script>
<script src="assets/js/api.js" defer>
</script>
<script src="assets/js/reviews.js" defer>
</script>
<script src="assets/js/food-ui.js" defer>
</script>
<script src="assets/js/detail.js" defer>
</script>
</body>
</html>
